# Render Blueprint for Prompt Wars
# Deploy via: https://dashboard.render.com/blueprints

services:
  # Backend API Server
  - type: web
    name: prompt-wars-server
    runtime: node
    region: oregon
    plan: starter
    buildCommand: cd server && npm ci && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: FAL_API_KEY
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false

  # Frontend Static Site
  - type: web
    name: prompt-wars-client
    runtime: static
    buildCommand: cd client && npm ci && npm run build
    staticPublishPath: client/dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SOCKET_URL
        fromService:
          name: prompt-wars-server
          type: web
          property: hostWithProtocol
      - key: VITE_DISCORD_CLIENT_ID
        sync: false
